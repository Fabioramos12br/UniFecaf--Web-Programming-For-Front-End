<!DOCTYPE html>
<html lang="pt-br">

<head>

    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <header class="cabecalho">


    </header>

            <p> Desenvolvido por: Fabio Ramos </p>
